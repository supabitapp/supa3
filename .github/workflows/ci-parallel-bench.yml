name: CI Parallel Steps Benchmark
on:
  push:
    branches: [supacode/ci-parallel-benchmark]
permissions:
  contents: read
jobs:
  lint:
    name: Lint ${{ matrix.mode }} ${{ matrix.sample }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, background]
        sample: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Mise
        uses: ./.github/actions/setup-mise
      - name: Install workspace dependencies
        run: mise exec -- vp install
      - name: Ensure Electron runtime is installed
        run: vp run --filter @supacode/desktop ensure:electron
      - name: Mark checks start
        run: date +%s%N > "$RUNNER_TEMP/lint-start"
      - name: Check unused code (serial)
        if: matrix.mode == 'serial'
        run: vp run knip:check
      - name: Check unused code (background)
        if: matrix.mode == 'background'
        background: true
        run: vp run knip:check
      - name: Check
        run: vp check
      - name: Wait for measurements
        wait-all:
      - name: Record checks time
        run: |
          elapsed_ns=$(( $(date +%s%N) - $(cat "$RUNNER_TEMP/lint-start") ))
          echo "mode=${{ matrix.mode }} sample=${{ matrix.sample }} elapsed_ns=$elapsed_ns" | tee -a "$GITHUB_STEP_SUMMARY"
