name: Mobile Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build (+ auto-submit to TestFlight / Google Play) or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - update
      profile:
        description: "Store build profile (v2-preview: TestFlight + Play closed track v2; build only)"
        required: true
        type: choice
        default: production
        options:
          - production
          - v2-preview
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: all
        options:
          - ios
          - android
          - all
      version:
        description: "Optional build version override (blank uses app.config.ts; an override is committed before building)"
        required: false
        type: string
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - assets/**
      - scripts/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-eas-production.yml
      - .github/actions/setup-mobile-release/**
      - .github/actions/build-mobile/**
      - .github/scripts/mobile-build-*.cjs

concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare mobile release
    runs-on: depot-ubuntu-24.04-8
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != '' && 'release' || '' }}
    outputs:
      enabled: ${{ steps.expo-token.outputs.present }}
      sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.source.outputs.matrix }}
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Reject preview OTA updates
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'v2-preview' && inputs.mode == 'update'
        run: |
          echo "::error::V2 previews use store builds only. Select mode=build."
          exit 1

      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Mise
        if: steps.expo-token.outputs.present == 'true'
        uses: ./.github/actions/setup-mise

      - name: Load release App credentials for version override
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != ''
        uses: ./.github/actions/load-release-secrets
        with:
          profile: release-app
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - id: version_app_token
        name: Mint release app token for version override
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ env.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout with version override push credentials
        if: steps.version_app_token.outcome == 'success'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.version_app_token.outputs.token }}

      - name: Apply manual version override
        if: steps.version_app_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.version_app_token.outputs.token }}
          APP_SLUG: ${{ steps.version_app_token.outputs.app-slug }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Version overrides require dispatching this workflow from a branch; received $GITHUB_REF_TYPE '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version override must contain two or three dot-separated integers; received '$RELEASE_VERSION'." >&2
            exit 1
          fi

          node --input-type=module -e '
            import fs from "node:fs";
            const path = "apps/mobile/app.config.ts";
            const source = fs.readFileSync(path, "utf8");
            const next = source.replace(
              /^(  version: ")[^"]+(".*)$/m,
              (_match, prefix, suffix) => prefix + process.env.RELEASE_VERSION + suffix,
            );
            if (next === source && !source.includes("  version: \"" + process.env.RELEASE_VERSION + "\"")) {
              throw new Error("Could not update app version");
            }
            fs.writeFileSync(path, next);
          '

          if git diff --quiet -- apps/mobile/app.config.ts; then
            echo "app.config.ts is already at $RELEASE_VERSION; no version commit needed."
            exit 0
          fi

          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add apps/mobile/app.config.ts
          git commit \
            -m "chore(mobile): bump app version to $RELEASE_VERSION" \
            -m "Co-authored-by: codex <codex@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - id: source
        name: Select build runners
        if: steps.expo-token.outputs.present == 'true'
        env:
          MOBILE_PLATFORM: ${{ inputs.platform || 'all' }}
          MOBILE_MODE: ${{ inputs.mode || 'auto' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e '
            import fs from "node:fs";
            const include = [
              { platform: "ios", runner: "depot-macos-26", legacy: false },
              { platform: "android", runner: "depot-ubuntu-24.04-8", legacy: false },
              { platform: "ios", runner: "depot-ubuntu-24.04-8", legacy: true },
            ].filter(({ platform, legacy }) =>
              (process.env.MOBILE_PLATFORM === "all" || platform === process.env.MOBILE_PLATFORM) &&
              (!legacy || process.env.MOBILE_MODE !== "build"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include }) + "\n");
          '

  production:
    name: Mobile ${{ matrix.platform }} ${{ matrix.legacy && 'existing binaries' || inputs.profile || 'production' }}
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      deployments: write
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MOBILE_PLATFORM: ${{ matrix.platform }}
      MOBILE_PROFILE: ${{ inputs.profile || 'production' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-mobile-release
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          environment: production
      - name: Verify v2 preview source
        if: inputs.profile == 'v2-preview'
        run: |
          node --input-type=module -e '
            import * as environment from "./packages/contracts/src/environment.ts";
            if (environment.ORCHESTRATION_PROTOCOL_VERSION !== 2) {
              throw new Error("V2 previews require a v2 source branch.");
            }
          '
      - id: config
        name: Resolve native fingerprint and app version
        working-directory: apps/mobile
        run: |
          version=$(npx expo config --json --type public | jq -er '.version')
          fingerprint=$(eas fingerprint:generate --platform "$MOBILE_PLATFORM" --environment production --json --non-interactive | sed -n '/^{/,$p' | jq -er '.hash')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - id: history
        name: Find completed Depot builds
        uses: actions/github-script@v8
        env:
          MOBILE_VERSION: ${{ steps.config.outputs.version }}
          MOBILE_FINGERPRINT: ${{ steps.config.outputs.fingerprint }}
        with:
          script: |
            const { findBuilds } = require('./.github/scripts/mobile-build-history.cjs');
            const { versionBuild, compatibleBuild } = await findBuilds({
              github, context, profile: process.env.MOBILE_PROFILE, platform: process.env.MOBILE_PLATFORM,
              version: process.env.MOBILE_VERSION, fingerprint: process.env.MOBILE_FINGERPRINT,
            });
            core.setOutput('version_exists', Boolean(versionBuild));
            core.setOutput('compatible', Boolean(compatibleBuild));
      - id: legacy
        name: Find existing cloud builds during migration
        if: env.MOBILE_PROFILE == 'production' && (steps.history.outputs.version_exists != 'true' || steps.history.outputs.compatible != 'true')
        working-directory: apps/mobile
        env:
          MOBILE_VERSION: ${{ steps.config.outputs.version }}
          MOBILE_FINGERPRINT: ${{ steps.config.outputs.fingerprint }}
        run: |
          version_count=$(eas build:list --platform "$MOBILE_PLATFORM" --build-profile production --app-version "$MOBILE_VERSION" --status finished --limit 1 --json --non-interactive | jq 'length')
          compatible_count=$(eas build:list --platform "$MOBILE_PLATFORM" --build-profile production --status finished --fingerprint-hash "$MOBILE_FINGERPRINT" --limit 1 --json --non-interactive | jq 'length')
          echo "version_exists=$([[ "$version_count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "compatible=$([[ "$compatible_count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: build
        name: Compile and sign on Depot
        if: ${{ !matrix.legacy && (inputs.mode == 'build' || (github.event_name == 'push' && steps.history.outputs.version_exists != 'true' && steps.legacy.outputs.version_exists != 'true')) }}
        uses: ./.github/actions/build-mobile
        with:
          platform: ${{ matrix.platform }}
          profile: ${{ env.MOBILE_PROFILE }}
      - id: artifact
        name: Save signed binary
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-${{ env.MOBILE_PROFILE }}-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error
          retention-days: 14
      - name: Submit signed binary to stores
        if: steps.build.outcome == 'success'
        working-directory: apps/mobile
        env:
          MOBILE_BINARY: ${{ steps.build.outputs.binary }}
        run: eas submit --platform "$MOBILE_PLATFORM" --profile "$MOBILE_PROFILE" --path "$MOBILE_BINARY" --non-interactive --wait
      - name: Record completed store build
        if: steps.build.outcome == 'success'
        uses: actions/github-script@v8
        env:
          MOBILE_VERSION: ${{ steps.config.outputs.version }}
          MOBILE_FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
          MOBILE_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          MOBILE_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          script: |
            const { recordBuild } = require('./.github/scripts/mobile-build-history.cjs');
            await recordBuild({
              github, context, profile: process.env.MOBILE_PROFILE, platform: process.env.MOBILE_PLATFORM,
              version: process.env.MOBILE_VERSION, fingerprint: process.env.MOBILE_FINGERPRINT,
              sha: process.env.MOBILE_SOURCE_SHA, url: process.env.MOBILE_ARTIFACT_URL,
            });
      - name: Publish compatible OTA update
        if: env.MOBILE_PROFILE == 'production' && (github.event_name == 'push' || inputs.mode == 'update')
        working-directory: apps/mobile
        env:
          MOBILE_FINGERPRINT: ${{ steps.config.outputs.fingerprint }}
          BUILT_FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
          DEPOT_COMPATIBLE: ${{ steps.history.outputs.compatible }}
          CLOUD_COMPATIBLE: ${{ steps.legacy.outputs.compatible }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          if [ "$DEPOT_COMPATIBLE" != true ] && [ "$CLOUD_COMPATIBLE" != true ] && [ "$BUILT_FINGERPRINT" != "$MOBILE_FINGERPRINT" ]; then
            echo "$MOBILE_PLATFORM: no completed build matches $MOBILE_FINGERPRINT; OTA skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          message="${UPDATE_MESSAGE:-$(git log -1 --pretty=%s | head -c 120) ($(git rev-parse --short=9 HEAD))}"
          eas update --channel production --environment production --platform "$MOBILE_PLATFORM" \
            --message "$message" --non-interactive
